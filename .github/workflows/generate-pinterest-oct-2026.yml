name: Generate Pinterest October 2026

on:
  push:
    paths:
      - "scripts/generate_pinterest_oct_2026.py"
      - ".github/workflows/generate-pinterest-oct-2026.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Generate October Pinterest images
        run: python scripts/generate_pinterest_oct_2026.py

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pinterest/2026-10/*.png
          if git diff --cached --quiet; then
            echo "No generated image changes."
          else
            git commit -m "Generate October 2026 Pinterest images"
            git push
          fi
